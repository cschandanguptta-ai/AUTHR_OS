[package]
name = "authr"
version = "3.0.0"
description = "AUTHR_OS — Rust core runtime: storage, bundle lifecycle, security"
edition = "2021"

[lib]
name = "authr"
path = "src/lib.rs"

[[bin]]
name = "authr"
path = "src/main.rs"

[features]
default = []
# Desktop shell + OS keyring are compiled on real desktop targets:
# cargo build --features gui,os-keychain
gui = ["dep:tauri", "dep:tauri-build"]
os-keychain = ["dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
whoami = "1"
keyring = { version = "3", optional = true, default-features = false, features = ["linux-native"] }
tauri = { version = "2", optional = true, default-features = false }

[profile.release]
opt-level = 2
lto = false
