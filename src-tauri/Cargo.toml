[package]
name = "authr"
version = "3.0.0"
description = "AUTHR_OS — Rust core runtime: storage, bundle lifecycle, security"
edition = "2021"

[lib]
name = "authr"
path = "src/lib.rs"

[[bin]]
name = "authr"
path = "src/main.rs"

[features]
default = []
# Desktop shell + OS keyring are compiled on real desktop targets:
# cargo build --features gui,os-keychain
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
os-keychain = ["dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
whoami = "1"
keyring = { version = "3", optional = true, default-features = false, features = ["linux-native"] }
tauri = { version = "2", optional = true, default-features = false }
# R-10: native open/save dialogs — a shell capability, NOT a contract change
# (docs/CLI_CONTRACT.md is untouched; the headless CLI binary never compiles it).
tauri-plugin-dialog = { version = "2", optional = true, default-features = false }
# ── Phase 4: audio stack ────────────────────────────────────────────────────
hound = "3.5"                                   # WAV encode/decode (16-bit PCM)
rubato = "0.16"                                 # high-quality resampling
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3"] }
sha2 = "0.10"                                   # content-addressable chunk keys, Edge-TTS GEC token
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# ── Phase 6: publishing & release ───────────────────────────────────────────
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# ── Phase 7: workerisation (ADR-0008) ───────────────────────────────────────
rayon = "1.10"                                  # data-parallel RAG embed + dense scan

[profile.release]
opt-level = 2
lto = false
