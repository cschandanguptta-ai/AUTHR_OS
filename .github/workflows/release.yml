name: Release

# Tag-driven packaging: builds the frontend and the core binary, then runs
# scripts/build_deliverables.py (the same packager used in the dev workspace)
# and attaches AUTHR_OS_v3.0.0-PROD.zip + AUTHR_OS_docs.zip to the Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build core binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package deliverable zips
        run: |
          python3 scripts/build_deliverables.py
          mv ../AUTHR_OS_*.zip .
      - name: Attach zips to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AUTHR_OS_v*-PROD.zip
            AUTHR_OS_docs.zip

  # Windows installers (.msi via WiX, .exe via NSIS) — bundle targets are
  # already configured in src-tauri/tauri.conf.json. Installers are unsigned.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop tracked Linux target artifacts (stale on MSVC)
        run: rm -rf src-tauri/target
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build Windows installers (msi + nsis)
        # gui,os-keychain: main.rs dispatches a bare launch to the Tauri
        # shell only when the gui feature is compiled in; os-keychain wires
        # the Windows Credential Manager provider.
        run: tauri build --features gui,os-keychain
        # tauri build runs beforeBuildCommand (npm run build) itself
      - name: Smoke-launch the built GUI
        run: |
          $p = Start-Process -FilePath "src-tauri\target\release\authr.exe" -PassThru -RedirectStandardError smoke-stderr.txt -RedirectStandardOutput smoke-stdout.txt -WindowStyle Hidden
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "=== GUI process exited early — smoke FAIL ==="
            Write-Host "--- stderr ---"; Get-Content smoke-stderr.txt
            Write-Host "--- stdout ---"; Get-Content smoke-stdout.txt
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI event loop alive after 30s — smoke PASS"
      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
